rules.title=How to play
rules.goal.title=The goal
rules.goal.body=Make your way through a dungeon of 44 cards. You start with 20 health. If it reaches 0, the run is over; clear every card and you win.
rules.cards.title=The cards
rules.cards.body=Clubs and spades are monsters. Each one deals damage equal to its value: 2 to 10, then 11 for a jack, 12 for a queen, 13 for a king and 14 for an ace. Diamonds are weapons and hearts are potions, both from 2 to 10.
rules.cards.monster=Monster
rules.cards.weapon=Weapon
rules.cards.potion=Potion
rules.rooms.title=Rooms
rules.rooms.body=Cards are dealt until four lie face up: that's a room. Take three of them, one at a time, in any order you like. The fourth stays and becomes part of the next room.
rules.rooms.first=First
rules.rooms.second=Second
rules.rooms.third=Third
rules.rooms.stays=Stays
rules.rooms.example=For example: equip the 5, fight the 8 with it and lose 3 health, then drink the 3. The jack stays for the next room.
rules.rooms.avoid=Before you take a card, you may avoid the room instead. All four cards go to the bottom of the dungeon, and a new room is dealt. You can't avoid two rooms in a row.
rules.rooms.last=When the dungeon runs out, the last room has to be finished: take every card in it.
rules.fight.title=Fighting
rules.fight.body=Fight a monster barehanded and you lose its full value. Fight it with your weapon and you lose only what the monster has over the weapon, never less than 0, and the monster lands on the weapon.
rules.fight.equip=Taking a weapon equips it right away. Your old weapon goes to the discard pile, along with every monster on it.
rules.weapon.title=The weapon rule
rules.weapon.body=Once a weapon has slain a monster, it can only fight monsters of the same or lower value than the last one it slew. Anything stronger has to be fought barehanded, but the weapon stays equipped.
rules.weapon.stack=Weapon 5, last kill a queen
rules.weapon.next=Next monster
rules.weapon.example=For example: this 5 last slew a queen, so it can fight the 6 for 1 damage. After that its last kill is the 6, and another queen would have to be fought barehanded.
rules.potions.title=Potions
rules.potions.body=A potion heals its value, up to 20 health. Only the first potion in a room heals; a second one in the same room is discarded and does nothing. Drinking at full health still counts as the room's potion.
rules.potions.heals=Heals 5
rules.potions.wasted=Wasted
rules.potions.example=For example: at 15 health, the 7 heals 5, since health stops at 20. The 4 in the same room heals nothing.
rules.score.title=Scoring
rules.score.body=Clear the dungeon and your score is the health you have left. If you finish at 20 health and your last card was a potion, add that potion's value.
rules.score.death=If you die, your score is your health minus every monster still in the dungeon. Health can drop below 0 on the last blow, and that counts too.
rules.original.title=The original game
rules.original.body=Scoundrel was designed by Zach Gage and Kurt Bieg in 2011. Deckdelve plays by their rules, explained here in its own words.
rules.original.link=Read the original rules (PDF)
rules.tutorial=Play the tutorial

achievement.unlocked=Achievement unlocked
achievement.full_arsenal=Full Arsenal
achievement.full_arsenal.body=Equip three weapons in a row, each one higher than the last, like 5, then 6, then 7.
achievement.straight=Straight
achievement.straight.body=Stack five kills on one weapon, each exactly one lower, like 8, 7, 6, 5, 4.
achievement.flush=Flush
achievement.flush.body=Stack five monsters of one suit on one weapon.
achievement.royal_flush=Royal Flush
achievement.royal_flush.body=Stack the ace, king, queen, jack and 10 of one suit in a row on one weapon.
achievement.twins=Twins
achievement.twins.body=Slay both monsters of one rank back to back with one weapon, like two 9s.
achievement.flawless=Flawless
achievement.flawless.body=Slay three monsters in one room without losing any health.
achievement.underdog=Underdog
achievement.underdog.body=Slay an ace with the 2 of diamonds, and live through it.
achievement.bare_knuckles=Bare Knuckles
achievement.bare_knuckles.body=Win a run with at least seven monsters slain barehanded.
achievement.knockout=Knockout
achievement.knockout.body=Slay an ace barehanded, and win the run.
achievement.ironman=Ironman
achievement.ironman.body=Win without avoiding a room.
achievement.escape_artist=Escape Artist
achievement.escape_artist.body=Win after avoiding at least five rooms.
achievement.waste_not=Waste Not
achievement.waste_not.body=Win without wasting a potion: never a second one in a room.
achievement.last_gasp=Last Gasp
achievement.last_gasp.body=Win with exactly 1 health.
achievement.overflowing=Overflowing
achievement.overflowing.body=Win with a score above 20, before any modifier.
achievement.perfect=Perfect
achievement.perfect.body=Win with a score of 30 before any modifier: full health, with the 10 of hearts last.
achievement.dragon_slayer=Dragon Slayer
achievement.dragon_slayer.body=Slay both aces with a weapon in one run.
achievement.masochist=Masochist
achievement.masochist.body=Win with three or more modifiers on.
achievement.hat_trick=Hat Trick
achievement.hat_trick.body=Win three runs in a row.
achievement.challenger=Challenger
achievement.challenger.body=Win at least once with each modifier on. One win can count for several.
achievement.veteran=Veteran
achievement.veteran.body=Win ten runs.

