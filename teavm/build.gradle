import org.teavm.gradle.api.OptimizationLevel

plugins {
  id 'java'
  id 'com.github.xpenatan.gdx-teavm' version "$gdxTeaVMVersion"
}

dependencies {
  implementation "com.github.xpenatan.gdx-teavm:backend-web:$gdxTeaVMVersion"
  implementation "com.github.xpenatan.gdx-teavm:gdx-freetype-web:$gdxTeaVMVersion"
  implementation project(':core')
}

// Development: gdx_teavm_web_js_run serves an unobfuscated build that rebuilds and reloads on changes.
// Release: gdx_teavm_web_{js,wasm}_release_build writes to build/dist/{js,wasm}/release/webapp,
// and the matching _run tasks serve that build locally.
gdxTeaVM {
  // teavm/assets holds what only the web page needs: its tab icon and the logo of its loading screen.
  assets.from(rootProject.files('assets'), files('assets'))

  webDefaults {
    mainClass.set('io.github.orumcan.deckdelve.teavm.TeaVMLauncher')
    htmlTitle.set(appName)
    logoPath.set('web/loading.png')
    // The logo is one of the assets above, so there is nothing to copy from the classpath.
    copyLoadingAsset.set(false)
  }

  js {
    devServer {
      enabled.set(true)
      autoBuild.set(true)
      autoReload.set(true)
      optimization.set(OptimizationLevel.NONE)
    }
  }

  js('release') {
    obfuscated.set(true)
    serverPort.set(8180)
    optimization.set(OptimizationLevel.BALANCED)
  }

  wasm('release') {
    obfuscated.set(true)
    serverPort.set(8181)
    optimization.set(OptimizationLevel.BALANCED)
  }
}

tasks.register('run') {
  dependsOn 'gdx_teavm_web_wasm_release_run'
}
build.dependsOn 'gdx_teavm_web_wasm_release_build'

// The web build as one zip with index.html at its top: what itch.io takes, and what the release publishes.
tasks.register('zipWeb', Zip) {
  dependsOn 'gdx_teavm_web_wasm_release_build'
  from layout.buildDirectory.dir('dist/wasm/release/webapp')
  // The license and the credits travel with the web build too.
  from rootProject.files('LICENSE', 'CREDITS.md')
  // A leftover of the local server that a static host has no use for.
  exclude 'WEB-INF/**'
  archiveFileName = "${appName}-${projectVersion}-web.zip"
  destinationDirectory = layout.buildDirectory.dir('dist')
}
