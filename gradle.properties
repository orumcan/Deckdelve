org.gradle.jvmargs=-Xmx2G -Dfile.encoding=UTF-8
android.useAndroidX=true
# R8's full mode can strip classes that libGDX reaches through reflection.
android.enableR8.fullMode=false

projectVersion=1.0.0
# Android's version code, one higher with every release. It also names the release's notes in fastlane/.
projectVersionCode=1
gdxVersion=1.14.2
gdxTeaVMVersion=1.6.2
junitVersion=6.1.3
# LWJGL 3.4.3 or newer avoids native-access warnings on Java 25 and up.
lwjgl3Version=3.4.3
